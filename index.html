<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Idris Design Studio</title>
<meta name="description" content="AI-native engineering design studio: describe a requirement, get physics-checked design variants.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" media="print" onload="this.media='all'">
<style>
:root{
  --chrome:#e4e8ee; --chrome2:#d9dee6; --panel:#f7f8fa; --white:#fff; --line:#cdd3dc; --line2:#b9c1cc; --hair:#e3e7ec;
  --text:#1b2330; --muted:#566273; --dim:#8692a2; --accent:#1f6feb; --accent-bg:#dce9fd; --accent-line:#8fb6f7;
  --ok:#16a34a; --ok-bg:#e3f6ea; --warn:#c27c0e; --warn-bg:#fdf3dc; --bad:#d93636; --bad-bg:#fde6e6;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --dockH:300px;
  --rib-a:#fafbfc; --rib-b:#eef1f5; --head-a:#f3f5f8; --head-b:#e8ecf1; --hover:#eaf0f8; --lt-bg:#e9edf3; --icon:#2a5aa8; --tag-ink:#1d5fc4;
  --vp-a:#b9c7d8; --vp-b:#dfe6ee; --vp-c:#f4f6f9; --glass:rgba(250,251,252,.92); --veil:rgba(240,243,247,.55); --sel-ink:#174ea6;
  --card-h:#f1f3f6; --track:#e6eaf0; --teal:#0e9f8e; --chip-ink:#1d4f9e; --err-line:#f3b5b5; --err-ink:#9b1c1c; --status:#eef1f5;
  --shadow:rgba(20,30,50,.18);
}
:root[data-theme=dark]{
  --chrome:#14181f; --chrome2:#1c222b; --panel:#181d25; --white:#11151b; --line:#2b333e; --line2:#3a4451; --hair:#232a34;
  --text:#e3e9f2; --muted:#9aa7b8; --dim:#6b7888; --accent:#4c8dff; --accent-bg:#1b2e4d; --accent-line:#33578f;
  --ok:#3ccf7a; --ok-bg:#15301f; --warn:#f0b13c; --warn-bg:#36290f; --bad:#ff6b6b; --bad-bg:#3a1a1c;
  --rib-a:#1d232c; --rib-b:#181d25; --head-a:#1e242d; --head-b:#191e26; --hover:#212a36; --lt-bg:#232b36; --icon:#7fb0ff; --tag-ink:#8db8ff;
  --vp-a:#0d1117; --vp-b:#151b24; --vp-c:#1d2530; --glass:rgba(24,29,37,.9); --veil:rgba(10,13,18,.55); --sel-ink:#b9d3ff;
  --card-h:#1c222b; --track:#262e39; --teal:#2fc4b0; --chip-ink:#a9c8ff; --err-line:#6b2b2e; --err-ink:#ffb4b4; --status:#12161c;
  --shadow:rgba(0,0,0,.5);
}
*{box-sizing:border-box} html,body{height:100%;margin:0}
body{background:var(--chrome);color:var(--text);font-family:var(--sans);font-size:13px;line-height:1.4;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
.mono,.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
svg.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

/* ------------------------------------------------ shell */
.app{display:grid;grid-template-rows:38px auto minmax(0,1fr) 24px;grid-template-columns:minmax(0,1fr);height:100dvh}
.titlebar{display:flex;align-items:center;gap:12px;padding:0 12px;background:#1d2633;color:#e8edf4}
.logo{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px;letter-spacing:.2px;white-space:nowrap}
.logo svg{width:18px;height:18px}
.doc{font-size:12.5px;color:#9fb0c6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.doc b{color:#e8edf4;font-weight:500}
.spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:#b6c3d4;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:#f0b429}
.pill.on .dot{background:#34d399} .pill.off .dot{background:#f87171}
.pill.off{cursor:pointer}

/* ribbon (CommandManager style) */
.ribbon{background:linear-gradient(var(--rib-a),var(--rib-b));border-bottom:1px solid var(--line);display:flex;align-items:stretch;overflow-x:auto;scrollbar-width:none}
.ribbon::-webkit-scrollbar{display:none}
.rgroup{display:flex;flex-direction:column;border-right:1px solid var(--hair);padding:4px 4px 0;flex:none}
.rgroup .cmds{display:flex;gap:2px;flex:1}
.rgroup .glabel{font-size:10px;color:var(--dim);text-align:center;padding:1px 0 3px;letter-spacing:.3px;white-space:nowrap}
.cmd{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:3px;min-width:58px;padding:5px 6px 3px;border:1px solid transparent;border-radius:4px;background:none;font-size:11px;color:var(--text);white-space:nowrap}
.cmd svg.i{width:22px;height:22px;stroke-width:1.4;color:var(--icon)}
.cmd:hover:not(:disabled){background:var(--accent-bg);border-color:var(--accent-line)}
.cmd.on{background:var(--accent-bg);border-color:var(--accent-line)}
.cmd:disabled{opacity:.38;cursor:default}
.cmd.only-narrow,.cmd.only-phone{display:none}
.cmd[hidden]{display:none!important}

.main{position:relative;display:grid;grid-template-columns:264px minmax(0,1fr) 380px;min-height:0}
.pane{min-height:0;display:flex;flex-direction:column;background:var(--panel)}
.pane-tree{border-right:1px solid var(--line)}
.pane-chat{border-left:1px solid var(--line)}
.phead{display:flex;align-items:center;gap:8px;height:30px;padding:0 10px;border-bottom:1px solid var(--line);background:linear-gradient(var(--head-a),var(--head-b));font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;flex:none}
.phead small{font-weight:400;text-transform:none;letter-spacing:0;color:var(--dim)}
.phead .x{margin-left:auto;background:none;border:0;padding:4px;color:var(--muted);display:none;border-radius:4px}
.phead .x:hover{background:var(--chrome2)}

/* ------------------------------------------------ feature tree */
.tree{flex:1;overflow:auto;padding:6px 0 12px;font-size:12.5px}
.tnode>summary{list-style:none;display:flex;align-items:center;gap:6px;padding:3px 8px;cursor:pointer;user-select:none;white-space:nowrap}
.tnode>summary::-webkit-details-marker{display:none}
.tnode>summary:hover{background:var(--hover)}
.tnode>summary .tw{width:10px;color:var(--dim);font-size:9px;transition:transform .15s;flex:none}
.tnode[open]>summary .tw{transform:rotate(90deg)}
.tnode>summary svg.i{color:var(--icon)}
.tnode>summary .cnt{margin-left:auto;font-size:11px;color:var(--dim)}
.tbody{padding:1px 0 4px 26px}
.troot{font-weight:600}
.prop{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;align-items:baseline;padding:3px 10px 3px 4px;border-left:1px dotted var(--line2)}
.prop .k{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prop .v{font-family:var(--mono);font-size:12px;text-align:right;white-space:nowrap}
.tag{font-family:var(--sans);font-size:9.5px;padding:0 5px;border-radius:3px;margin-left:5px;vertical-align:1px;white-space:nowrap}
.tag.set{color:var(--tag-ink);background:var(--accent-bg)} .tag.assumed{color:var(--warn);background:var(--warn-bg)}
.titem{display:flex;align-items:center;gap:7px;width:100%;text-align:left;background:none;border:0;border-left:1px dotted var(--line2);padding:4px 10px 4px 6px;white-space:nowrap}
.titem:hover{background:var(--hover)}
.titem.sel{background:var(--accent-bg);box-shadow:inset 2px 0 0 var(--accent)}
.titem .lt{width:18px;height:18px;border-radius:3px;background:var(--lt-bg);border:1px solid var(--line);display:grid;place-items:center;font-size:10.5px;font-weight:600;color:var(--icon);flex:none}
.titem.sel .lt{background:var(--accent);border-color:var(--accent);color:#fff}
.titem .nm{font-weight:500}
.titem .tg{color:var(--dim);font-size:11px;overflow:hidden;text-overflow:ellipsis;min-width:0}
.titem .ms{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--muted)}
.tempty{color:var(--dim);padding:4px 8px 4px 6px;border-left:1px dotted var(--line2);font-size:12px;white-space:normal}

/* ------------------------------------------------ center: viewport + results */
.center{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) 5px var(--dockH);min-width:0;min-height:0}
.center.dock-closed{grid-template-rows:minmax(0,1fr) 5px 30px}
.viewport{position:relative;min-height:0;overflow:hidden;background:linear-gradient(180deg,var(--vp-a) 0%,var(--vp-b) 55%,var(--vp-c) 100%)}
.viewport canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.vempty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--muted);text-align:center;padding:24px;pointer-events:none}
.vempty b{color:var(--text);font-weight:600;font-size:14px}
.vempty.hide{display:none}
.hud{position:absolute;top:8px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:1px;padding:2px;border:1px solid var(--line2);border-radius:5px;background:var(--glass);box-shadow:0 1px 4px rgba(20,30,50,.12);z-index:3;white-space:nowrap}
.hud button{display:grid;place-items:center;width:30px;height:28px;background:none;border:1px solid transparent;border-radius:4px;color:var(--text)}
.hud button svg.i{width:18px;height:18px}
.hud button:hover:not(:disabled){background:var(--accent-bg);border-color:var(--accent-line)}
.hud button.on{background:var(--accent-bg);border-color:var(--accent-line);color:var(--sel-ink)}
.hud button:disabled{opacity:.35;cursor:default}
.hud .sep{width:1px;height:20px;background:var(--line);margin:0 3px}
.vlabel{position:absolute;left:90px;bottom:12px;font-size:12px;color:var(--text);z-index:2;pointer-events:none;background:var(--glass);border:1px solid var(--line);border-radius:4px;padding:3px 8px;font-family:var(--mono)}
.vlabel:empty{display:none}
.vlabel b{font-family:var(--sans);font-weight:600}
.triad{position:absolute;left:8px;bottom:8px;width:74px;height:74px;pointer-events:none;z-index:2}
.vload{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:var(--veil);z-index:4;color:var(--muted);gap:10px}
.vload.on{display:flex}
.spin{width:14px;height:14px;border:2px solid rgba(0,0,0,.12);border-top-color:var(--accent);border-radius:50%;animation:rot .8s linear infinite;display:inline-block;flex:none}
@keyframes rot{to{transform:rotate(360deg)}}
.fab{position:absolute;right:12px;bottom:12px;z-index:3;display:none;align-items:center;gap:7px;padding:9px 14px;border-radius:20px;border:0;background:var(--accent);color:#fff;font-weight:500;box-shadow:0 3px 10px rgba(31,111,235,.35)}
.fab svg.i{width:16px;height:16px}

.splitter{background:var(--chrome2);border-top:1px solid var(--line);border-bottom:1px solid var(--line);cursor:row-resize;touch-action:none}
.splitter:hover{background:var(--accent-line)}
.dock{display:flex;flex-direction:column;min-height:0;background:var(--panel)}
.dtabs{display:flex;align-items:stretch;height:30px;flex:none;border-bottom:1px solid var(--line);background:linear-gradient(var(--head-a),var(--head-b))}
.dtabs button{background:none;border:0;border-right:1px solid var(--hair);padding:0 14px;font-size:12px;color:var(--muted);white-space:nowrap}
.dtabs button.on{background:var(--panel);color:var(--text);font-weight:600;box-shadow:inset 0 2px 0 var(--accent)}
.dtabs .dsub{display:flex;align-items:center;padding:0 10px;color:var(--dim);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.dtabs .tog{margin-left:auto;border-left:1px solid var(--hair);border-right:0;padding:0 10px}
.center.dock-closed .tog svg{transform:rotate(180deg)}
.dbody{flex:1;overflow:auto;padding:10px}
.dbody[hidden]{display:none}
.empty{color:var(--dim);font-size:12.5px;padding:6px 2px}

.sim-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.rcard{border:1px solid var(--line);border-radius:4px;background:var(--white);overflow:hidden}
.rcard h4{margin:0;padding:6px 10px;font-size:10.5px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);background:var(--card-h);border-bottom:1px solid var(--hair);display:flex;align-items:center;gap:6px}
.rcard h4 .st{margin-left:auto}
.rcard .rb{padding:6px 10px 8px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px solid var(--hair);font-size:12px}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--muted)} .kv .v{font-family:var(--mono);white-space:nowrap}
.st{font-size:10px;font-weight:600;padding:1px 6px;border-radius:3px;letter-spacing:.3px}
.st.pass{color:var(--ok);background:var(--ok-bg)} .st.marg{color:var(--warn);background:var(--warn-bg)} .st.fail{color:var(--bad);background:var(--bad-bg)}
.gauges{display:flex;gap:6px;justify-content:space-around;padding:4px 0 2px}
.gauge{text-align:center;flex:1;min-width:0} .gauge svg{width:100%;max-width:120px}
.gauge .gl{font-size:10.5px;color:var(--muted);margin-top:-2px}
.bar2{display:grid;grid-template-columns:118px 1fr 30px;gap:8px;align-items:center;font-size:11.5px;color:var(--muted);margin:5px 0}
.bar2 i{display:block;height:6px;border-radius:2px;background:var(--track);overflow:hidden}
.bar2 em{display:block;height:100%;background:var(--accent);border-radius:2px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.bar2.d em{background:var(--teal)}
.bar2 b{font-family:var(--mono);font-weight:500;color:var(--text);text-align:right}
.disc{margin-top:10px;font-size:11px;color:var(--dim);border-left:2px solid var(--line2);padding-left:8px}

.study{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:10px;align-items:start}
.pareto svg{width:100%;height:auto;display:block}
.pareto .cap{font-size:11px;color:var(--dim);padding:2px 10px 8px}
.pt{cursor:pointer}
table.grid{width:100%;border-collapse:collapse;font-size:12px;background:var(--white)}
table.grid th,table.grid td{padding:5px 8px;border-bottom:1px solid var(--hair);text-align:right;white-space:nowrap}
table.grid th{font-size:10.5px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;color:var(--muted);background:var(--card-h);position:sticky;top:0}
table.grid td{font-family:var(--mono)}
table.grid th:first-child,table.grid td:first-child{text-align:left;font-family:var(--sans)}
table.grid tbody tr{cursor:pointer}
table.grid tbody tr:hover{background:var(--hover)}
table.grid tbody tr.sel{background:var(--accent-bg)}
table.grid td.best{color:var(--ok);font-weight:500}
.tblwrap{border:1px solid var(--line);border-radius:4px;overflow:auto}

/* ------------------------------------------------ chat (task pane) */
.chat{flex:1;overflow:auto;padding:12px 10px;scroll-behavior:smooth;background:var(--white)}
.msg{margin:0 0 12px;max-width:100%;animation:fadeup .3s ease both}
@keyframes fadeup{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.msg.user{display:flex;justify-content:flex-end}
.msg.user .bub{background:var(--accent);color:#fff;border-radius:10px 10px 2px 10px;padding:7px 11px;max-width:88%;white-space:pre-wrap;word-break:break-word}
.msg.ai{display:flex;gap:8px}
.avatar{flex:none;width:22px;height:22px;border-radius:5px;background:#1d2633;display:grid;place-items:center;margin-top:1px}
.avatar svg{width:13px;height:13px}
.ai-body{min-width:0;flex:1}
.ai-body p{margin:0 0 7px} .ai-body p.m{color:var(--muted);font-size:12px}
.think{border:1px solid var(--line);border-radius:5px;background:var(--panel);margin:2px 0 8px;overflow:hidden}
.think-h{display:flex;align-items:center;gap:8px;padding:6px 10px;font-size:12px;color:var(--muted);cursor:pointer;user-select:none}
.think-h .chev{margin-left:auto;transition:transform .2s} .think.closed .chev{transform:rotate(-90deg)} .think.closed .steps{display:none}
.steps{list-style:none;margin:0;padding:0 10px 8px}
.steps li{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim);padding:2px 0}
.steps li.act{color:var(--text)} .steps li.done{color:var(--muted)}
.steps .ic{width:14px;height:14px;flex:none;display:grid;place-items:center}
.steps li.act .ic::before{content:"";width:11px;height:11px;border:2px solid rgba(0,0,0,.12);border-top-color:var(--accent);border-radius:50%;animation:rot .8s linear infinite}
.steps li.done .ic::before{content:"✓";color:var(--ok);font-size:12px}
.steps li.wait .ic::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--line2)}
.steps li.bad .ic::before{content:"✕";color:var(--bad);font-size:12px}
.tnote{font-size:11.5px;color:var(--warn);padding:0 10px 8px}
.cards{display:flex;flex-direction:column;gap:5px;margin:6px 0}
.vcard{display:block;width:100%;text-align:left;background:var(--white);border:1px solid var(--line);border-radius:5px;padding:7px 9px;transition:border-color .15s,background .15s}
.vcard:hover{border-color:var(--accent-line);background:var(--hover)}
.vcard.sel{border-color:var(--accent);background:var(--accent-bg);box-shadow:inset 3px 0 0 var(--accent)}
.vc-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:3px}
.vc-h b{font-size:12.5px}
.badge{font-size:10.5px;color:var(--tag-ink);background:var(--accent-bg);border-radius:3px;padding:1px 6px;text-align:right}
.vc-facts{margin-top:4px;display:flex;flex-wrap:wrap;gap:2px 10px;font-family:var(--mono);font-size:11px;color:var(--muted)} .vc-facts span b{color:var(--text);font-weight:500}
.vcard .bar2{grid-template-columns:150px 1fr 30px;margin:3px 0}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin:7px 0 2px}
.chip{background:var(--white);border:1px solid var(--line2);border-radius:4px;padding:4px 9px;font-size:12px;color:var(--chip-ink)}
.chip:hover{background:var(--accent-bg);border-color:var(--accent-line)}
.chips.stale .chip{opacity:.4;pointer-events:none}
.cmp{width:100%;border-collapse:collapse;margin:6px 0;font-size:11.5px}
.cmp th,.cmp td{padding:4px 6px;border-bottom:1px solid var(--hair);text-align:right;font-family:var(--mono)}
.cmp th:first-child,.cmp td:first-child{text-align:left;font-family:var(--sans);color:var(--muted)}
.cmp th{font-family:var(--sans);font-weight:600;background:var(--card-h)} .cmp td.best{color:var(--ok);font-weight:500}
.err{border:1px solid var(--err-line);background:var(--bad-bg);border-radius:4px;padding:7px 9px;color:var(--err-ink);font-size:12.5px;margin:4px 0 6px}
.diag{display:grid;gap:4px;margin:6px 0}
.input{border-top:1px solid var(--line);padding:8px 10px 10px;background:var(--panel);flex:none}
.inbox{display:flex;align-items:flex-end;gap:6px;border:1px solid var(--line2);border-radius:6px;padding:4px 4px 4px 10px;background:var(--white)}
.inbox:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(31,111,235,.12)}
.inbox textarea{flex:1;resize:none;background:none;border:0;outline:0;color:var(--text);font:inherit;font-size:13px;max-height:120px;padding:5px 0;line-height:1.4}
.send{width:30px;height:30px;border-radius:5px;border:0;background:var(--accent);display:grid;place-items:center;flex:none}
.send:disabled{opacity:.4;cursor:default} .send svg{width:15px;height:15px}
.hint{font-size:10.5px;color:var(--dim);margin:5px 1px 0}

/* status bar */
.status{display:flex;align-items:center;gap:0;background:var(--status);border-top:1px solid var(--line);font-size:11px;color:var(--muted);overflow:hidden;white-space:nowrap}
.status>span{padding:0 10px;border-right:1px solid var(--line);height:100%;display:flex;align-items:center;gap:6px}
.status .r{margin-left:auto;border-left:1px solid var(--line);border-right:0}
.status .pill{color:var(--muted)}

.scrim{display:none}

/* ------------------------------------------------ tablet: chat becomes a task-pane flyout over the viewport */
@media (max-width:1180px){
  .main{grid-template-columns:240px minmax(0,1fr)}
  .pane-chat{position:absolute;top:0;right:0;bottom:0;width:min(400px,86vw);z-index:20;transform:translateX(102%);transition:transform .22s ease;box-shadow:-6px 0 24px rgba(20,30,50,.18)}
  body.chat-open .pane-chat{transform:none}
  .pane-chat .phead .x{display:block}
  .cmd.only-narrow{display:flex}
  .fab{display:inline-flex}
  .vlabel{top:auto;bottom:12px;left:90px}
  body.chat-open .fab{display:none}
}
/* phone: feature tree also becomes a flyout; viewport + results stay together */
@media (max-width:700px){

<script>/* Idris viewer: dependency-free WebGL STL viewer (orbit/zoom, grid floor, feature edges, wireframe, section, standard views). */
class Viewer {
  constructor(canvas, host) {
    this.canvas = canvas; this.host = host; this.ok = false;
    this.yaw = 0.62; this.pitch = 0.38; this.dist = 400; this.fov = 32 * Math.PI / 180;
    this.model = null; this.parts = []; this.housingMode = "glass"; this.highlight = -1; this.wire = false; this.section = false;
    this.dirty = true; this.pointers = new Map(); this.pinch = 0; this.onView = null; this.anim = null;
    const gl = canvas.getContext('webgl', { antialias: true, alpha: true, premultipliedAlpha: false });
    if (!gl) return;
    this.gl = gl; this.ok = true;
    this._initGL();
    this._bindInput();
    this.ro = new ResizeObserver(() => this.resize());
    this.ro.observe(host);
    this.resize();
    const loop = (t) => { this._frame(t); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  }

  _prog(vs, fs) {
    const gl = this.gl;
    const mk = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; };
    const p = gl.createProgram();
    gl.attachShader(p, mk(gl.VERTEX_SHADER, vs)); gl.attachShader(p, mk(gl.FRAGMENT_SHADER, fs));
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
    return p;
  }

  _initGL() {
    const gl = this.gl;
    this.pMesh = this._prog(
      `attribute vec3 aPos; attribute vec3 aNor; uniform mat4 uMVP; uniform mat4 uMV; uniform mat4 uModel; varying vec3 vN; varying vec3 vV; varying vec3 vP;
       void main(){ vP = (uModel*vec4(aPos,1.0)).xyz; vec4 p = uMV*vec4(aPos,1.0); vV = -p.xyz; vN = (uMV*vec4(aNor,0.0)).xyz; gl_Position = uMVP*vec4(aPos,1.0); }`,
      `precision mediump float; varying vec3 vN; varying vec3 vV; varying vec3 vP; uniform vec3 uColor; uniform float uClip; uniform float uAlpha;
       void main(){
         if(uClip>0.5 && vP.x>0.0) discard;
         vec3 n = normalize(vN); vec3 v = normalize(vV);
         vec3 base = uColor;
         if(!gl_FrontFacing){ n = -n; if(uClip>0.5) base = vec3(0.86,0.52,0.30); }
         vec3 l1 = normalize(vec3(0.35,0.7,0.65)); vec3 l2 = normalize(vec3(-0.6,0.15,0.5));
         float d1 = max(dot(n,l1),0.0); float d2 = max(dot(n,l2),0.0); float hemi = 0.5+0.5*n.y;
         vec3 h = normalize(l1+v); float s = pow(max(dot(n,h),0.0),48.0)*0.35;
         vec3 col = base*(0.30+0.20*hemi+0.55*d1+0.22*d2) + vec3(s);
         gl_FragColor = vec4(col,uAlpha); }`);
    this.pField = this._prog(
      `attribute vec3 aPos; attribute vec3 aNor; attribute float aS; attribute vec3 aD; uniform mat4 uMVP; uniform mat4 uMV; uniform float uDef;
       varying vec3 vN; varying vec3 vV; varying vec3 vP; varying float vS;
       void main(){ vec3 p = aPos + aD*uDef; vP = p; vS = aS; vec4 q = uMV*vec4(p,1.0); vV = -q.xyz; vN = (uMV*vec4(aNor,0.0)).xyz; gl_Position = uMVP*vec4(p,1.0); }`,
      `#ifdef GL_FRAGMENT_PRECISION_HIGH
       precision highp float;
       #else
       precision mediump float;
       #endif
       varying vec3 vN; varying vec3 vV; varying vec3 vP; varying float vS; uniform float uClip;
       vec3 turbo(float x){ x = clamp(x,0.0,1.0);
         vec4 r4 = vec4(0.13572138, 4.61539260, -42.66032258, 132.13108234); vec4 g4 = vec4(0.09140261, 2.19418839, 4.84296658, -14.18503333);
         vec4 b4 = vec4(0.10667330, 12.64194608, -60.58204836, 110.36276771); vec2 r2 = vec2(-152.94239396, 59.28637943);
         vec2 g2 = vec2(4.27729857, 2.82956604); vec2 b2 = vec2(-89.90310912, 27.34824973);
         vec4 v4 = vec4(1.0, x, x*x, x*x*x); vec2 v2 = v4.zw*v4.z;
         return vec3(dot(v4,r4)+dot(v2,r2), dot(v4,g4)+dot(v2,g2), dot(v4,b4)+dot(v2,b2)); }
       void main(){
         if(uClip>0.5 && vP.x>0.0) discard;
         vec3 n = normalize(vN); if(!gl_FrontFacing) n = -n;
         vec3 l1 = normalize(vec3(0.35,0.7,0.65)); float d = max(dot(n,l1),0.0); float hemi = 0.5+0.5*n.y;
         gl_FragColor = vec4(turbo(0.1+0.85*vS)*(0.62+0.28*d+0.10*hemi), 1.0); }`);
    this.pLine = this._prog(
      `attribute vec3 aPos; attribute float aA; uniform mat4 uMVP; uniform mat4 uModel; varying float vA; varying vec3 vP;
       void main(){ vA = aA; vP = (uModel*vec4(aPos,1.0)).xyz; gl_Position = uMVP*vec4(aPos,1.0); }`,
      `precision mediump float; varying float vA; varying vec3 vP; uniform vec4 uColor; uniform float uClip;
       void main(){ if(uClip>0.5 && vP.x>0.0) discard; gl_FragColor = vec4(uColor.rgb, uColor.a*vA); }`);
    gl.enable(gl.DEPTH_TEST); gl.enable(gl.BLEND);
    gl.blendFuncSeparate(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA, gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
    gl.clearColor(0, 0, 0, 0);
  }

  _buf(data) { const gl = this.gl, b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b);
    gl.bufferData(gl.ARRAY_BUFFER, data, gl.STATIC_DRAW); return b; }

  _bindInput() {
    const c = this.canvas;
    const touch = () => { this.anim = null; this.dirty = true; };
    c.addEventListener('pointerdown', (e) => { c.setPointerCapture(e.pointerId);
      this.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY }); this.pinch = 0; touch(); });
    c.addEventListener('pointermove', (e) => {
      const p = this.pointers.get(e.pointerId); if (!p) return;
      if (this.pointers.size === 1) {
        this.yaw -= (e.clientX - p.x) * 0.008;
        this.pitch = Math.max(-1.55, Math.min(1.55, this.pitch + (e.clientY - p.y) * 0.008));
      }
      p.x = e.clientX; p.y = e.clientY;
      if (this.pointers.size === 2) {
        const [a, b] = [...this.pointers.values()]; const d = Math.hypot(a.x - b.x, a.y - b.y);
        if (this.pinch) this.dist = Math.max(this.minDist(), Math.min(this.maxDist(), this.dist * this.pinch / d));
        this.pinch = d;
      }
      touch();
    });
    const up = (e) => { this.pointers.delete(e.pointerId); this.pinch = 0; touch(); };
    c.addEventListener('pointerup', up); c.addEventListener('pointercancel', up);
    c.addEventListener('wheel', (e) => { e.preventDefault();
      this.dist = Math.max(this.minDist(), Math.min(this.maxDist(), this.dist * Math.exp(e.deltaY * 0.0012))); touch(); },
      { passive: false });
  }
  minDist() { return this.model ? this.model.radius * 0.8 : 10; }
  maxDist() { return this.model ? this.model.radius * 12 : 5000; }

  resize() {
    if (!this.ok) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = Math.max(1, Math.floor(this.host.clientWidth * dpr)), h = Math.max(1, Math.floor(this.host.clientHeight * dpr));
    if (this.canvas.width !== w || this.canvas.height !== h) { this.canvas.width = w; this.canvas.height = h; }
    this.dirty = true;
  }

  fitDist() {
    const W = this.canvas.width || 1, H = this.canvas.height || 1, a = W / H;
    const half = Math.min(this.fov / 2, Math.atan(Math.tan(this.fov / 2) * a));
    return this.model.radius / Math.sin(half) * 1.12;
  }
  /** Animate the camera to a target orientation (standard views). */
  goTo(yaw, pitch, dist, target) {
    if (!this.model) return;
    let dy = ((yaw - this.yaw) % (2 * Math.PI) + 3 * Math.PI) % (2 * Math.PI) - Math.PI;
    const t0 = this.target || [0, 0, 0], t1 = target || [0, 0, 0];
    this.anim = { t0: performance.now(), from: [this.yaw, this.pitch, this.dist, ...t0], to: [this.yaw + dy, pitch, dist ?? this.fitDist(), ...t1] };
    this.dirty = true;
  }
  /** Fly the camera to look at a point (review findings). */
  focusOn(p) { if (this.model) this.goTo(this.yaw, Math.max(0.2, Math.min(0.9, this.pitch)), this.model.radius * 1.6, p); }
  fit() { if (this.model) this.goTo(this.yaw, this.pitch, this.fitDist()); }
  setView(name) {
    const V = { iso: [0.62, 0.42], front: [0, 0], top: [0, 1.55], right: [Math.PI / 2, 0] }[name];
    if (V) this.goTo(V[0], V[1]);
  }
  setWireframe(on) { this.wire = on; this.dirty = true; }
  setSection(on) { this.section = on; if (on) this.goTo(1.05, 0.3); this.dirty = true; }
  clear() { if (this.ok) { this._free(); this.setEnvelope(null); this.setMotion(null); this.setField(null); } this.model = null; this.motion = null; this.playing = false; this.spinT = 0; this.section = false; this.dirty = true; }

  /** Upload several STL parts that share ONE coordinate frame (mm). parts: [{buf, kind, name}].
   *  The whole assembly is centred once, so parts keep their relative positions. */
  setParts(parts) {
    if (!this.ok) return null;
    const raw = parts.map((p) => this._parseSTL(p.buf));
    let mn = [Infinity, Infinity, Infinity], mx = [-Infinity, -Infinity, -Infinity];
    for (const t of raw) for (let i = 0; i < t.length; i += 3) for (let k = 0; k < 3; k++) {
      if (t[i + k] < mn[k]) mn[k] = t[i + k]; if (t[i + k] > mx[k]) mx[k] = t[i + k]; }
    const c = [(mn[0] + mx[0]) / 2, (mn[1] + mx[1]) / 2, (mn[2] + mx[2]) / 2];
    const size = [mx[0] - mn[0], mx[1] - mn[1], mx[2] - mn[2]];
    const radius = Math.hypot(size[0], size[1], size[2]) / 2;
    this._free(); this.center = c; this.setField(null);
    this.parts = parts.map((p, i) => this._build(raw[i], c, p));
    const half = Math.max(size[0], size[2]) * 1.8, cells = 24, step = (2 * half) / cells, gy = -size[1] / 2 - radius * 0.02;
    const gp = [], ga = [];
    for (let i = 0; i <= cells; i++) {
      const p = -half + i * step;
      for (const [x1, z1, x2, z2] of [[p, -half, p, half], [-half, p, half, p]]) {
        for (const [x, z] of [[x1, z1], [x2, z2]]) { gp.push(x, gy, z); ga.push(Math.max(0, 1 - Math.hypot(x, z) / (half * 1.2))); }
      }
    }
    this.model = { radius, size, grid: this._buf(new Float32Array(gp)), gridA: this._buf(new Float32Array(ga)), gridN: gp.length / 3 };
    this.highlight = -1; this.setMotion(null); this.spinT = 0; this.playing = false;
    this.anim = null; this.target = [0, 0, 0]; this.yaw = 0.62; this.pitch = 0.42; this.dist = this.fitDist(); this.dirty = true;
    return { parts: this.parts.length, triangles: this.parts.reduce((s, p) => s + p.n, 0), size_mm: size };
  }
  /** Single STL (fallback: housing only). */
  setModel(buffer) { return this.setParts([{ buf: buffer, kind: 'housing', name: 'Housing' }]); }
  setVisible(i, on) { if (this.parts && this.parts.at(i)) { this.parts.at(i).visible = on; this.dirty = true; } }
  setHighlight(i) { this.highlight = i; this.dirty = true; }
  setHousingMode(m) { this.housingMode = m; this.dirty = true; }
  /** FEA result surface (same mm frame as the assembly): positions xyz, triangle indices, per-node displacement xyz. */
  setField(f) {
    const gl = this.gl;
    if (this.field) for (const k of ['pos', 'nor', 'feat', 'featA', 'wire', 'wireA', 's', 'd']) if (this.field[k]) gl.deleteBuffer(this.field[k]);
    this.field = null; this.fieldOn = false;
    if (f && this.ok) {
      const c = this.center || [0, 0, 0], P = f.positions, I = f.indices, D = f.displacement, nT = I.length / 3;
      const tris = new Float32Array(nT * 9), dsp = new Float32Array(nT * 9), map = new Uint32Array(nT * 3);
      for (let t = 0; t < nT; t++) for (let v = 0; v < 3; v++) { const n = I[t * 3 + v], o = t * 9 + v * 3; map[t * 3 + v] = n;
        for (let k = 0; k < 3; k++) { tris[o + k] = P[n * 3 + k]; dsp[o + k] = D ? D[n * 3 + k] : 0; } }
      const part = this._build(tris, c, { kind: 'field', name: 'FEA' });
      part.d = this._buf(dsp); part.map = map; part.s = null;
      part.nodes = new Float32Array(P.length); for (let i = 0; i < P.length; i++) part.nodes[i] = P[i] - c[i % 3];
      part.disp = D || null;

function handleLocal(text) {
  const s = text.toLowerCase();
  const letters = [...s.matchAll(/\b(?:variant\s*)?([a-e])\b/g)].map((m) => m[1].toUpperCase());

  if (/\b(reset|start over|new design|clear)\b/.test(s)) return resetAll();
  if (state.variants.length && /\b(compare|versus|vs)\b/.test(s)) {
    const ids = [...new Set(letters)].map((L) => L.charCodeAt(0) - 65).filter((i) => state.variants[i]);
    if (ids.length >= 2) return compare(ids[0], ids[1]);
  }
  const patch = parseText(text);
  const hasPatch = Object.keys(patch).length > 0;
  if (state.variants.length && !hasPatch) {
    const m = s.match(/\b(?:show|select|open|detail|choose|pick|load|view|go with|take)\s+(?:variant\s*)?([a-e])\b/) || s.match(/\bvariant\s*([a-e])\b/);
    if (m) { const i = m[1].toUpperCase().charCodeAt(0) - 65; if (state.variants[i]) return selectVariant(i); }
    if (/download|stl/.test(s)) return downloadSTL();
  }
  if (!hasPatch && state.pending) {
    const nums = (s.replace(/(\d),(\d)/g, '$1.$2').match(/\d+(?:\.\d+)?/g) || []).map(Number);
    if (state.pending === 'power' && nums.length) patch.power_kw = nums[0];
    else if (state.pending === 'ratio' && nums.length) patch.gear_ratio = nums[0];
    else if (state.pending === 'envelope' && nums.length >= 3) { patch.envelope_width = nums[0]; patch.envelope_height = nums[1]; patch.envelope_depth = nums[2]; }
  }
  if (!Object.keys(patch).length) return noUnderstand();
  applyPatch(patch);
}

function noUnderstand() {
  say(para("I couldn't find engineering values in that. Give me power, gear ratio and the envelope it must fit in — for example:"),
    para('“15 kW gearbox, ratio 8:1, envelope 200 x 200 x 150 mm”', 'm'),
    chips([{ label: 'Use demo requirements', text: DEMO_TEXT }]));
}
const DEMO_TEXT = 'reducer 15 hp, rasio 8, muat 20x20x15 cm';

function diffText(patch) {
  const bits = [];
  for (const [k, v] of Object.entries(patch)) {
    const before = eff(k);
    bits.push(before != null && before !== v && state.data ? `${NAMES[k]} ${before}${UNITS[k] || ''} → ${v}${UNITS[k] || ''}` : `${NAMES[k]} ${v}${UNITS[k] || ''}`);
  }
  return bits.join(', ');
}

function applyPatch(patch, preface) {
  const had = !!state.data;
  const d = diffText(patch);
  Object.assign(state.userSet, patch);
  renderTree();
  const miss = missing();
  if (miss.length) return askMissing(d);
  state.pending = null;
  run(preface || (had ? L(`Updated: ${d}. Re-running the design search.`, `Diperbarui: ${d}. Menjalankan ulang pencarian desain.`) : L(`Got it: ${d}. Starting the design search.`, `Oke: ${d}. Memulai pencarian desain.`)));
}

function askMissing(got) {
  const first = missing()[0]; state.pending = first;
  const q = {
    power: [L('What power does the gearbox need to transmit?', 'Berapa daya yang harus disalurkan gearbox?'), ['5 kW', '15 kW', '50 kW'].map((t) => ({ label: t, text: t }))],
    ratio: [L('What overall gear ratio do you need (input speed ÷ output speed)?', 'Berapa rasio total yang dibutuhkan (putaran input ÷ putaran output)?'), ['4:1', '8:1', '20:1'].map((t) => ({ label: t, text: 'ratio ' + t }))],
    envelope: [L('What is the maximum envelope (W x H x D in mm) it must fit in?', 'Berapa ruang maksimum (L x T x D dalam mm) yang tersedia?'), ['150 x 150 x 100 mm', '200 x 200 x 150 mm', '300 x 300 x 200 mm'].map((t) => ({ label: t, text: t }))],
  }[first];
  say(got ? para(L(`Noted: ${got}.`, `Dicatat: ${got}.`), 'm') : null, para(q[0]), chips(q[1]));
}

function resetAll() {
  state.userSet = {}; state.pending = null; state.data = null; state.variants = []; state.sel = null; state.stl = {}; state.housing = null;

/* ---------------------------------------------------------------- run: variants */
const STEPS = ['Reading requirements', 'Sweeping the design space (module × teeth × face width)', 'Checking bending (Lewis) and contact (Hertz) stress', 'Selecting from the Pareto front'];
const EXTRA_KEYS = new Set();
function buildBody() {
  const b = {}; for (const k of ['power_kw', 'input_rpm', 'gear_ratio', 'envelope_width', 'envelope_height', 'envelope_depth', 'wall_thickness',
    'gear_material', 'housing_material', 'min_sf_bending', 'min_sf_contact', ...EXTRA_KEYS]) if (state.userSet[k] != null) b[k] = state.userSet[k];
  return b;
}
async function run(note) {
  state.busy = true; setBusy(true); openChatIfNarrow();
  const body = buildBody();
  const box = aiMsg(); if (note) box.append(para(note));
  const th = thinking(STEPS); box.append(th.el); th.set(0); scrollDown();
  $('#sbVariant').textContent = 'Running design search…';
  let i = 0; const tick = setInterval(() => { if (i < STEPS.length - 1) th.set(++i); }, 1200);
  const cold = setTimeout(() => th.note('The engine was asleep (free hosting) — waking it up. The first request can take up to a minute.'), 7000);
  try {
    const d = await api('/generate-variants', body);
    clearInterval(tick); clearTimeout(cold);
    state.data = d; state.variants = d.variants || []; state.runId++; state.sel = null; state.lastRun = d; state.housing = null; clearViewport();
    th.done(`${fi(d.diagnostics.candidates_evaluated)} designs checked`);
    renderAll(); if (state.variants.length) setDtab('study');
    presentResults(box, d);
  } catch (e) {
    clearInterval(tick); clearTimeout(cold); th.fail('Stopped');
    box.append(h('div', { class: 'err' }, e.message || 'Something went wrong.'));
    box.append(chips([{ label: 'Retry', fn: () => run('Retrying…') }]));
    if (e.status === 422 || e.status === 400) state.pending = null;
  } finally { state.busy = false; setBusy(false); updateStatus(); scrollDown(); }
}

function presentResults(box, d) {
  const vs = d.variants || [], dg = d.diagnostics;
  if (!vs.length) {
    box.append(para(`I checked ${fi(dg.candidates_evaluated)} designs and none satisfies every requirement at once.`));
    const rb = dg.rejected_by || {}, tot = dg.candidates_evaluated || 1;
    const lab = { envelope: 'Too big for the envelope', bending: 'Bending stress too high', contact: 'Contact stress too high', ratio: 'Ratio off target' };
    const rows = Object.entries(rb).sort((a, b) => b[1] - a[1]).map(([k, v]) => h('div', { class: 'bar2', style: 'grid-template-columns:150px 1fr 44px' }, h('span', null, lab[k] || k), h('i', null, h('em', { style: `width:${Math.min(100, v / tot * 100)}%` })), h('b', null, fi(v))));
    box.append(h('div', { class: 'diag' }, rows));
    const reps = (Array.isArray(d.repairs) ? d.repairs : []).filter((x) => x && x.change && Object.keys(x.change).length);
    (d.suggestions || []).filter((t) => !(reps.length && /^solver check/i.test(String(t)))).forEach((t) => box.append(para('• ' + t, 'm')));
    if (reps.length) box.append(repairList(reps));
    box.append(chips(reps.length ? [{ label: 'Change input speed', fn: () => askSpeed() }]
      : [{ label: 'Enlarge envelope +20 mm', fn: () => enlarge() }, { label: 'Relax safety factors (1.25 / 1.0)', fn: () => relaxSF() }, { label: 'Change input speed', fn: () => askSpeed() }]));
    return;
  }
  const bal = balanced(vs);
  box.append(para(`${fi(dg.candidates_evaluated)} designs checked, ${fi(dg.feasible)} passed every check. ${vs.length === 1 ? 'One option qualifies:' : `${vs.length} options below — best balance is ${vs[bal].name} (${vs[bal].tag.toLowerCase()}).`}`));
  box.append(vlist(vs, bal));
  if (d.assumed_defaults && d.assumed_defaults.length)
    box.append(para(`${d.assumed_defaults.length} values were assumed (marked in the design tree). Tell me the real ones and I will re-run.`, 'm'));
  box.append(chips(refineChips()));
}

  wall_thickness: 'wall', gear_material: 'gear material', housing_material: 'housing material', min_sf_bending: 'min SF bending', min_sf_contact: 'min SF contact' };

  if (env.every((e) => c[e] != null) && k.length === 3) return `Envelope → ${f(c.envelope_width, 0)} × ${f(c.envelope_height, 0)} × ${f(c.envelope_depth, 0)} mm`;

}

function balanced(vs) { let b = 0; vs.forEach((v, i) => { if (v.scores.physics_pct + v.scores.design_pct > vs[b].scores.physics_pct + vs[b].scores.design_pct) b = i; }); return b; }

function refineChips() {

function relaxSF() { say(para('Lowering the minimum safety factors makes designs less conservative. I will use 1.25 (bending) and 1.0 (contact) — you decide whether that is acceptable for your application.', 'm')); applyPatch({ min_sf_bending: 1.25, min_sf_contact: 1.0 }, 'Re-running with minimum safety factors 1.25 (bending) / 1.0 (contact).'); }

function highlight() {
  document.querySelectorAll('.vcard,.vrow').forEach((c) => c.classList.toggle('sel', +c.dataset.run === state.runId && +c.dataset.i === state.sel));
  document.querySelectorAll('.pt').forEach((p) => { const on = +p.dataset.i === state.sel; const c = p.querySelector('circle');
    c.setAttribute('r', on ? 7.5 : 5.5); c.setAttribute('fill', on ? 'var(--accent)' : 'var(--white)'); });
  document.querySelectorAll('table.grid tbody tr').forEach((r) => r.classList.toggle('sel', +r.dataset.i === state.sel));
}
function pareto(vs) {
  const W = 380, H = 220, pl = 40, pr = 16, pt = 14, pb = 34;
  const xs = vs.map((v) => v.scores.physics_pct), ys = vs.map((v) => v.scores.design_pct);
  const rng = (a) => { let lo = Math.min(...a), hi = Math.max(...a); if (hi - lo < 10) { const c = (hi + lo) / 2; lo = c - 6; hi = c + 6; } const pad = (hi - lo) * 0.15; return [Math.max(0, Math.floor(lo - pad)), Math.min(100, Math.ceil(hi + pad))]; };
  const [x0, x1] = rng(xs), [y0, y1] = rng(ys);
  const X = (v) => pl + (v - x0) / (x1 - x0) * (W - pl - pr), Y = (v) => H - pb - (v - y0) / (y1 - y0) * (H - pt - pb);
  const ns = 'http://www.w3.org/2000/svg'; const s = document.createElementNS(ns, 'svg'); s.setAttribute('viewBox', `0 0 ${W} ${H}`);
  const add = (tag, a, txt, parent = s) => { const e = document.createElementNS(ns, tag); for (const k in a) e.setAttribute(k, a[k]); if (txt != null) e.textContent = txt; parent.append(e); return e; };
  add('rect', { x: pl, y: pt, width: W - pl - pr, height: H - pt - pb, fill: 'var(--white)', stroke: 'var(--line)' });
  for (let k = 0; k <= 4; k++) { const gx = x0 + (x1 - x0) * k / 4, gy = y0 + (y1 - y0) * k / 4;
    add('line', { x1: X(gx), y1: pt, x2: X(gx), y2: H - pb, stroke: 'var(--hair)' }); add('line', { x1: pl, y1: Y(gy), x2: W - pr, y2: Y(gy), stroke: 'var(--hair)' });
    add('text', { x: X(gx), y: H - pb + 13, fill: 'var(--dim)', 'font-size': 10, 'text-anchor': 'middle', 'font-family': 'JetBrains Mono,monospace' }, Math.round(gx));
    add('text', { x: pl - 5, y: Y(gy) + 3, fill: 'var(--dim)', 'font-size': 10, 'text-anchor': 'end', 'font-family': 'JetBrains Mono,monospace' }, Math.round(gy)); }
  add('text', { x: (pl + W - pr) / 2, y: H - 6, fill: 'var(--muted)', 'font-size': 10.5, 'text-anchor': 'middle', 'font-family': 'Inter,sans-serif' }, 'Physics score (%)');
  add('text', { x: 11, y: (pt + H - pb) / 2, fill: 'var(--muted)', 'font-size': 10.5, 'text-anchor': 'middle', 'font-family': 'Inter,sans-serif', transform: `rotate(-90 11 ${(pt + H - pb) / 2})` }, 'Design & Mfg. (%)');
  const front = vs.map((_, i) => i).filter((i) => !vs.some((_, j) => j !== i && xs[j] >= xs[i] && ys[j] >= ys[i] && (xs[j] > xs[i] || ys[j] > ys[i])));
  const order = front.slice().sort((a, b) => xs[a] - xs[b]);
  if (order.length > 1) add('polyline', { points: order.map((i) => `${X(xs[i])},${Y(ys[i])}`).join(' '), fill: 'none', stroke: 'var(--accent-line)', 'stroke-width': 1.5, 'stroke-dasharray': '4 3' });
  vs.forEach((v, i) => {
    const onF = front.includes(i);
    const g = add('g', { class: 'pt', 'data-i': i, 'data-front': onF ? 1 : 0, transform: `translate(${X(xs[i])},${Y(ys[i])})` });
    add('circle', { r: 5.5, fill: 'var(--white)', stroke: onF ? 'var(--accent)' : 'var(--dim)', 'stroke-width': 2 }, null, g);
    add('text', { y: -10, fill: 'var(--text)', 'font-size': 11, 'text-anchor': 'middle', 'font-weight': 600, 'font-family': 'Inter,sans-serif' }, v.name.slice(-1), g);
    add('circle', { r: 16, fill: 'transparent' }, null, g);
    g.addEventListener('click', () => selectVariant(i));
  });
  const dom = vs.length - front.length;
  return h('div', { class: 'rcard pareto' }, h('h4', null, 'Pareto front'), s, h('div', { class: 'cap' }, `Up and to the right is better. Dashed line = Pareto front (${front.length} variants)` + (dom ? `; grey = beaten on both scores by another variant (${dom}).` : '.') + ' Click a point to open it.'));
}

/* ---------------------------------------------------------------- gear motion, power flow, envelope ghost */
function teethOf(p) {
  const m = p.meta || {};
  for (const k of ['teeth', 'z', 'num_teeth', 'n_teeth', 'tooth_count']) if (Number(m[k]) > 0) return Number(m[k]);

/** Read the assembly geometry: gear axes and radii, which gears mesh, which share a shaft, and the power path. */

  if (!gears.length) return null;
  const perp = (a, b, axis) => { const o = [0, 1, 2].filter((k) => k !== axis); return Math.hypot(a.c[o[0]] - b.c[o[0]], a.c[o[1]] - b.c[o[1]]); };
  const overlap = (a, b, k) => Math.min(a.p.bb.max[k], b.p.bb.max[k]) - Math.max(a.p.bb.min[k], b.p.bb.min[k]);
  const coax = (a, b) => a.axis === b.axis && perp(a, b, a.axis) < 0.15 * Math.min(a.r, b.r);

  const shaftOf = (g) => { let best = null, bo = 0;
    for (const s of shafts) { if (!coax(g, s)) continue; const o = overlap(g, s, g.axis); if (o > bo) { bo = o; best = s; } }
    return best; };

  let meshes = (a, b) => a !== b && a.axis === b.axis && overlap(a, b, a.axis) > 0 && (() => { const d = perp(a, b, a.axis), sr = a.r + b.r; return d < sr * 1.02 && d > sr * 0.8; })();

}

function envelopeCheck(v) {

    const cnt = { critical: 0, warning: 0, info: 0 }; rec.findings.forEach((y) => { cnt[y.severity]++; });
    const st = cnt.critical ? h('span', { class: 'st fail' }, `${cnt.critical} CRITICAL`) : cnt.warning ? h('span', { class: 'st marg' }, `${cnt.warning} WARNING${cnt.warning > 1 ? 'S' : ''}`) : h('span', { class: 'st pass' }, 'CLEAN');
    const filt = h('div', { class: 'seg' }, [['all', `All ${rec.findings.length}`], ['critical', `Critical ${cnt.critical}`], ['warning', `Warning ${cnt.warning}`], ['info', `Info ${cnt.info}`]].map(([k, t]) =>
      h('button', { class: rec.filter === k ? 'on' : '', onclick: () => { rec.filter = k; renderAnalysis(); applyField(); } }, t)));
    const list = h('div', { class: 'findings' }, rec.findings.map((y, i) => (rec.filter !== 'all' && rec.filter !== y.severity) ? null :
      h('button', { class: 'finding ' + y.severity + (i === rec.pick ? ' on' : ''), onclick: () => {
        rec.pick = rec.pick === i ? -1 : i; renderAnalysis(); applyField();
        if (rec.pick >= 0 && Array.isArray(y.at)) { const c = viewer.center || [0, 0, 0]; viewer.focusOn(y.at.map((q, k) => q - c[k])); } } },
        h('span', { class: 'pin ' + y.severity }, String(y.n)),
        h('span', { class: 'fx-b' }, h('b', null, y.message),
          h('span', { class: 'fx-p' }, y.part || '', y.part && !(viewer.parts || []).some((pp) => pp.name === y.part) ? h('span', { class: 'nomatch' }, ' · part not found in this assembly, not highlighted') : null),
          y.fix ? h('span', { class: 'fx-f' }, 'Fix: ' + y.fix) : null))));
    out.push(card('Findings', [filt, rec.findings.length ? list : para('No problems found for the selected checks.', 'm'),
      x.checked_parts != null ? h('div', { class: 'hint2' }, `${fi(x.checked_parts)} parts checked${x.solve_time_s != null ? ` in ${f(x.solve_time_s, 1)} s` : ''}.`) : null], st));
  }
  const fn = frameNote(rec.fit), ws = [...(x.warnings || []), ...(fn ? [fn] : [])];
  const w = warnCard({ warnings: ws }); if (w) out.push(w);
  return out;
}
const goAnalysis = (k) => { setDtab('fea'); state.anKind = k; state.probe = null; renderAnalysis(); applyField();
  if (state.sel == null) { openChatIfNarrow(); say(L('Open a variant first, then run the analysis from the Analysis tab.', 'Buka satu varian dulu, lalu jalankan analisis dari tab Analysis.')); } };
Object.entries(AN).forEach(([k, a]) => { const bt = $(a.btn); if (bt) bt.onclick = () => goAnalysis(k); });
if (!LAB) ['#cModal', '#cCfd', '#cReview'].forEach((sel2) => { const bt = $(sel2); if (bt) bt.hidden = true; });
/* names used elsewhere in the app */
const renderFea = renderAnalysis, applyFea = applyField, feaOverlayItems = anOverlayItems;

/* ---------------------------------------------------------------- theme */
function setTheme(t) {
  if (t === 'dark') document.documentElement.dataset.theme = 'dark'; else delete document.documentElement.dataset.theme;
  try { localStorage.setItem('idris-theme', t); } catch (e) { /* storage unavailable */ }
  $('#themeBtn').innerHTML = ''; $('#themeBtn').append(icon(t === 'dark' ? 'sun' : 'moon'));
  viewer.dirty = true; if (state.variants.length) renderStudy();
}
$('#themeBtn').onclick = () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
if (document.documentElement.dataset.theme === 'dark') { $('#themeBtn').innerHTML = ''; $('#themeBtn').append(icon('sun')); }

/* ---------------------------------------------------------------- screening badge */
$('#scrBadge').onclick = (e) => popAt(e.currentTarget, 'Screening-level results', [
  para('Numbers come from closed-form gear formulas (Lewis bending, Hertz contact, AGMA-style load factors) with representative material data.'),
  para('Use them to compare variants and size a design early. They are not a certified analysis; the housing structure is not checked yet (FEA is a later milestone).', 'm')]);

/* ---------------------------------------------------------------- one-page report (print / save as PDF) */
function snapshot() {
  if (!viewer.ok || !viewer.model) return null;
  try { viewer._draw(); const c = viewer.canvas, o = document.createElement('canvas'); o.width = c.width; o.height = c.height;
    const g = o.getContext('2d'); g.fillStyle = '#e9eef4'; g.fillRect(0, 0, o.width, o.height); g.drawImage(c, 0, 0); return o.toDataURL('image/png'); }
  catch (e) { return null; }
}
function buildReport() {
  const d = state.data, r = d.requirements, vs = state.variants, v = state.sel != null ? vs[state.sel] : vs[balanced(vs)];
  const img = state.sel != null ? snapshot() : null, now = new Date();
  const row = (k, val) => h('tr', null, h('td', null, k), h('td', null, val));
  const t2 = (rows) => h('table', null, h('tbody', null, rows.map(([a, b]) => row(a, b))));
  const st = v.stress, k = v.kinematics, m = v.mass_kg, dz = v.design;
  return [
    h('h1', null, `Idris Design Studio — ${$('#projName').textContent}`),
    h('div', { class: 'meta' }, `Gearbox design study · ${now.toISOString().slice(0, 10)} · selected: ${v.name} (${v.tag})`),
    h('h2', null, 'Requirements'),
    t2([['Power', f(r.power_kw, 1) + ' kW'], ['Input speed', r.input_rpm + ' rpm'], ['Gear ratio', r.gear_ratio + ' : 1'], ['Envelope', `${r.envelope_mm.width} × ${r.envelope_mm.height} × ${r.envelope_mm.depth} mm`],
      ['Gear / housing material', `${r.gear_material} / ${r.housing_material}`], ['Min. safety factor (bending / contact)', `${f(r.min_sf_bending, 2)} / ${f(r.min_sf_contact, 2)}`],
      ['Assumed (not given)', (d.assumed_defaults || []).map((x) => NAMES[x]).join(', ') || 'none']]),
    h('h2', null, `Variants (${fi(d.diagnostics.candidates_evaluated)} checked, ${fi(d.diagnostics.feasible)} feasible)`),
    h('table', null, h('thead', null, h('tr', null, ['Variant', 'Tag', 'Physics', 'Design', 'SF bend', 'SF cont', 'Mass', 'Envelope'].map((x) => h('th', null, x)))),
      h('tbody', null, vs.map((x) => h('tr', { class: x === v ? 'sel' : '' }, h('td', null, x.name), h('td', null, x.tag), h('td', null, x.scores.physics_pct + '%'), h('td', null, x.scores.design_pct + '%'),
        h('td', null, f(x.stress.sf_bending, 2)), h('td', null, f(x.stress.sf_contact, 2)), h('td', null, f(x.mass_kg.total, 2) + ' kg'),
        h('td', null, `${x.envelope_needed_mm.width}×${x.envelope_needed_mm.height}×${x.envelope_needed_mm.depth}`))))),
    h('h2', null, `${v.name} — detail`),
    img ? h('img', { src: img, alt: v.name + ' 3D view' }) : null,
    h('div', { class: 'two' },
      t2([['Module', dz.module_mm + ' mm'], ['Teeth (pinion / gear)', `${dz.pinion_teeth} / ${dz.gear_teeth}`], ['Face width', dz.face_width_mm + ' mm'], ['Stages', dz.stages], ['Center distance', f(dz.center_distance_mm, 1) + ' mm'], ['Actual ratio', f(k.ratio_actual, 3) + ' : 1']]),
      t2([['SF bending', `${f(st.sf_bending, 2)} (≥ ${f(r.min_sf_bending, 2)})`], ['SF contact', `${f(st.sf_contact, 2)} (≥ ${f(r.min_sf_contact, 2)})`], ['Output torque', f(k.output_torque_nm, 1) + ' N·m'], ['Output speed', f(k.output_rpm, 0) + ' rpm'], ['Efficiency', f(k.efficiency * 100, 1) + ' %'], ['Total mass', f(m.total, 2) + ' kg']])),
    h('div', { class: 'disc' }, d.disclaimer || 'Screening-level results. Not a certified analysis.'),
  ];
}
$('#cRep').onclick = () => {
  if (!state.variants.length) return;
  const rep = $('#report'); rep.innerHTML = ''; rep.append(...buildReport().filter(Boolean));
  setTimeout(() => window.print(), 50);
};

/* ---------------------------------------------------------------- input wiring */
function send() { const t = inp.value; if (!t.trim()) return; inp.value = ''; inp.style.height = 'auto'; handleText(t); }
sendBtn.addEventListener('click', send);
inp.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });
inp.addEventListener('input', () => { inp.style.height = 'auto'; inp.style.height = Math.min(120, inp.scrollHeight) + 'px'; });
window.addEventListener('resize', () => viewer.resize());

renderAll();
say(para('Hi, I am Idris. Describe the gearbox you need — power, gear ratio and the envelope it has to fit in — and I will generate physics-checked design options you can compare and open in 3D.'),
  para('Everything is computed from engineering formulas (Lewis bending, Hertz contact); nothing is made up. Values you do not give me are marked “assumed”.', 'm'),
  chips([{ label: 'Use demo: 15 hp · 8:1 · 20×20×15 cm', text: DEMO_TEXT }]));
window.__idris = { state, parseText, viewer, frameFit };
})();
